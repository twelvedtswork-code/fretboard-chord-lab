name: android-init
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate signing keystore
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore signing.keystore -alias chordlab \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Fretboard Chord Lab, O=twelvedtswork, C=PH"
          base64 -w0 signing.keystore > keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
          retention-days: 3

name: android
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore keystore
        run: printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | tr -d '\r\n ' | base64 -d > signing.keystore
      - name: Point bubblewrap at the runner toolchain
        run: |
          REAL="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          CLT=$(ls "$REAL/cmdline-tools" | head -1)
          ln -sfn "$REAL/cmdline-tools/$CLT" "$SDK/cmdline-tools/latest"
          ln -sfn "$REAL/cmdline-tools/$CLT" "$SDK/tools"
          for d in build-tools platforms platform-tools licenses ndk cmake extras; do
            [ -e "$REAL/$d" ] && ln -sfn "$REAL/$d" "$SDK/$d"
          done
          echo "cmdline-tools source: $CLT"; ls -la "$SDK" "$SDK/cmdline-tools"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
      - name: Stamp version from run number
        run: |
          jq --argjson vc ${{ github.run_number }} '.appVersionCode=$vc | .appVersionName=("1.0."+($vc|tostring))' twa-manifest.json > t.json && mv t.json twa-manifest.json
      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          printf 'y\ny\ny\n' | npx -y @bubblewrap/cli update --skipVersionUpgrade
          printf 'y\ny\ny\n' | npx -y @bubblewrap/cli build --skipPwaValidation
      - name: Publish assetlinks.json for fullscreen verification
        run: |
          mkdir -p .well-known
          FP=$(keytool -list -v -keystore signing.keystore -alias chordlab -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.github.twelvedtswork_code.chordlab","sha256_cert_fingerprints":["%s"]}}]' "$FP" > .well-known/assetlinks.json
          touch .nojekyll
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .well-known/assetlinks.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish assetlinks.json for TWA verification"
            git pull --rebase origin main
            git push
          fi
      - name: Attach APK to a release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" app-release-signed.apk \
            --title "Chord Lab APK v1.0.${{ github.run_number }}" \
            --notes "Sideloadable Android APK (Trusted Web Activity wrapping the live app)."
